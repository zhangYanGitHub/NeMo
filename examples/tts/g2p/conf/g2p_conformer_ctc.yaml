# 标准容量 Conformer-CTC G2P：优先验证准确率，再根据结果回退到更小模型。
# 替换 espeak-ng G2P 时，建议先用该配置拿到稳定 PER，再逐步裁剪层数/宽度做端侧折中。
name: G2P-Conformer-CTC

# 训练时改为你的 jsonl manifest；仅导出随机 ckpt 时可保持 null
train_manifest: null
validation_manifest: null
test_manifest: null
do_training: True
do_testing: True
pretrained_model: null # path to .nemo file or model name from list_available_models()

model:
  model_name: conformer_bpe
  # 先留足长度，减少长词/短句被截断带来的准确率损失
  max_source_len: 256

  tokenizer_grapheme:
    dataset:
      _target_: nemo.collections.common.tokenizers.char_tokenizer.CharTokenizer
    unk_token: "<unk>"
    vocab_file: null
    do_lower: true
    # 开启标点：保留逗号/句号等进入 grapheme 词表，模型才能在标点处学到停顿（piper 合成气口）。
    add_punctuation: true

  embedding:
    d_model: 512

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.embedding.d_model}
    feat_out: -1
    n_layers: 12
    d_model: 512

    # G2P 不能降采样：CTC 要求 encoder 时间步 T >= 目标音素数 U。
    # 输入是字符、输出是音素，二者长度相近；factor=2 会让 T≈字符/2 < 音素数，
    # 绝大多数样本无法对齐（zero_infinity 把 loss 置 0、无梯度），导致 PER 高居不下。
    # factor=1 时 encoder 走不降采样的 Linear 分支，T=字符长度，才能正确对齐。
    subsampling: striding
    subsampling_factor: 1
    subsampling_conv_channels: -1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [ -1, -1 ]
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 1024

    conv_kernel_size: 31
    conv_norm_type: layer_norm

    # 从“先过拟合”转为“可泛化”的默认正则强度
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.1
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.ConvASRDecoder
    feat_in: null
    num_classes: -1
    vocabulary: null

  tokenizer:
    # ipa_symbol：目录内需有 vocab.txt（使用新预处理产物）
    dir: dataset/normal/en-US
    type: ipa_symbol

  train_ds:
    manifest_filepath: ${train_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: true
      batch_size: 32
      num_workers: 8

  validation_ds:
    manifest_filepath: ${validation_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 32
      num_workers: 4

  test_ds:
    manifest_filepath: ${test_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 32
      num_workers: 2

  optim:
    name: adamw
    lr: 1.0
    betas: [ 0.9, 0.98 ]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 8000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: 1
  max_epochs: 400
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  precision: 16
  accumulate_grad_batches: 1
  enable_checkpointing: True
  logger: False
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: True
  create_checkpoint_callback: True
  checkpoint_callback_params:
    save_top_k: -1
    monitor: "val_per"
    mode: "min"
    save_best_model: true
    every_n_epochs: 1
