# 标准容量 Conformer-CTC G2P：优先验证准确率，再根据结果回退到更小模型。
# 替换 espeak-ng G2P 时，建议先用该配置拿到稳定 PER，再逐步裁剪层数/宽度做端侧折中。
name: G2P-Conformer-CTC

# 训练时改为你的 jsonl manifest；仅导出随机 ckpt 时可保持 null
train_manifest: null
validation_manifest: null
test_manifest: null
do_training: True
do_testing: True
pretrained_model: null # path to .nemo file or model name from list_available_models()

model:
  model_name: conformer_bpe
  # 先留足长度，减少长词/短句被截断带来的准确率损失
  max_source_len: 256

  tokenizer_grapheme:
    dataset:
      _target_: nemo.collections.common.tokenizers.char_tokenizer.CharTokenizer
    unk_token: "<unk>"
    # 输入字符表的单一真源 = 预处理产出的 grapheme_vocab.txt（含该语言全部字符，如德语 ä ö ü ß、
    # 法语重音、连字符 -）。留 null 时会自动从 model.tokenizer.dir 下找 grapheme_vocab.txt；找到就用它
    # （多语言只需把 tokenizer.dir 指到对应语言目录，无需改代码）。两者都没有才回退到写死的 ASCII
    # （仅够英文，非 ASCII 字母会在训练/推理时被丢弃）。也可在此显式给绝对路径覆盖。
    vocab_file: null
    # 保留大小写：espeak 对 B15/I-5/US-101 等按字母名发音依赖大小写；lower 会让
    # "US"(字母) 和 "us"(单词) 塌成同一输入却要对应不同音素，训练信号打架。
    do_lower: false
    # 纯净 G2P：标点不进 grapheme 词表。前端按 split_into_segments() 切分后送无标点片段，
    # 停顿由前端在片段间按规则插入 , / . token（与训练数据 --split-on-punctuation 对齐）。
    add_punctuation: false

  embedding:
    d_model: 512

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.embedding.d_model}
    feat_out: -1
    n_layers: 12
    d_model: 512

    # G2P 不能降采样：CTC 要求 encoder 时间步 T >= 目标音素数 U。
    # 输入是字符、输出是音素，二者长度相近；factor=2 会让 T≈字符/2 < 音素数，
    # 绝大多数样本无法对齐（zero_infinity 把 loss 置 0、无梯度），导致 PER 高居不下。
    # factor=1 时 encoder 走不降采样的 Linear 分支，T=字符长度，才能正确对齐。
    subsampling: striding
    subsampling_factor: 1
    subsampling_conv_channels: -1

    ff_expansion_factor: 4

    self_attention_model: rel_pos
    n_heads: 8
    att_context_size: [ -1, -1 ]
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 1024

    conv_kernel_size: 31
    conv_norm_type: layer_norm

    # 从“先过拟合”转为“可泛化”的默认正则强度
    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.1
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.ConvASRDecoder
    feat_in: null
    num_classes: -1
    vocabulary: null

  tokenizer:
    # 只需给这一个目录（该语言预处理产物目录），代码会自动定位输入/输出两张词表：
    #   输出音素表：dir/phoneme_vocab.txt（找不到才回退 dir/vocab.txt）
    #   输入字符表：dir/grapheme_vocab.txt（见上方 tokenizer_grapheme.vocab_file，同样自动查找）
    # 多语言只需改这一个 dir，无需改代码或写别的路径。
    dir: dataset/normal/en-US
    type: ipa_symbol
    # 可选：显式覆盖输出音素表路径（一般留 null，靠上面 dir 自动找 phoneme_vocab.txt）。
    vocab_path: null

  train_ds:
    manifest_filepath: ${train_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: true
      batch_size: 32
      num_workers: 8

  validation_ds:
    manifest_filepath: ${validation_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 32
      num_workers: 4

  test_ds:
    manifest_filepath: ${test_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 32
      num_workers: 2

  optim:
    name: adamw
    lr: 1.0
    betas: [ 0.9, 0.98 ]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 8000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: 1
  max_epochs: 400
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  precision: 16
  accumulate_grad_batches: 1
  enable_checkpointing: True
  logger: False
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: True
  create_checkpoint_callback: True
  checkpoint_callback_params:
    save_top_k: -1
    monitor: "val_per"
    mode: "min"
    save_best_model: true
    every_n_epochs: 1
