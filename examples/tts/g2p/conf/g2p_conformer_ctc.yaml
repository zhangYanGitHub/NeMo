# 端侧最小 Conformer-CTC G2P：用于替换 espeak-ng 路线上的体积/时延基线（需自行训练后才有正确读音）。
# 随机初始化 .nemo 见下方「导出未训练 ckpt」命令。
name: G2P-Conformer-CTC

# 训练时改为你的 jsonl manifest；仅导出随机 ckpt 时可保持 null
train_manifest: null
validation_manifest: null
test_manifest: null
do_training: True
do_testing: False
pretrained_model: null # path to .nemo file or model name from list_available_models()

model:
  model_name: conformer_bpe
  # 单词级 G2P 一般远小于 128；可按最长词再调大
  max_source_len: 64

  tokenizer_grapheme:
    dataset:
      _target_: nemo.collections.common.tokenizers.char_tokenizer.CharTokenizer
    unk_token: "<unk>"
    vocab_file: null
    do_lower: true
    add_punctuation: false

  embedding:
    d_model: 128

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.embedding.d_model}
    feat_out: -1
    n_layers: 4
    d_model: 128

    # 下采样缩短时间维，利于端上时延（短序列也通常略快）
    subsampling: striding
    subsampling_factor: 2
    subsampling_conv_channels: -1

    ff_expansion_factor: 2

    self_attention_model: rel_pos
    n_heads: 4
    att_context_size: [ -1, -1 ]
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 256

    conv_kernel_size: 15
    conv_norm_type: layer_norm

    dropout: 0.0
    dropout_pre_encoder: 0.0
    dropout_emb: 0.0
    dropout_att: 0.0

  decoder:
    _target_: nemo.collections.asr.modules.ConvASRDecoder
    feat_in: null
    num_classes: -1
    vocabulary: null

  tokenizer:
    # ipa_symbol：目录内需有 vocab.txt（此处使用仓库内 en-US 音素表）
    dir: dataset/normal/en-US
    type: ipa_symbol

  train_ds:
    manifest_filepath: ${train_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: true
      batch_size: 8
      num_workers: 2

  validation_ds:
    manifest_filepath: ${validation_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 8
      num_workers: 2

  test_ds:
    manifest_filepath: ${test_manifest}
    dataset:
      _target_: "nemo.collections.tts.g2p.data.ctc.CTCG2PBPEDataset"
      phoneme_field: "text"
      grapheme_field: "text_graphemes"
    dataloader_params:
      drop_last: false
      shuffle: false
      batch_size: 8
      num_workers: 0

  optim:
    name: adamw
    lr: 1.0
    betas: [ 0.9, 0.98 ]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 1000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: 1
  max_epochs: 30
  num_nodes: 1
  accelerator: auto
  strategy: auto
  precision: 32
  accumulate_grad_batches: 1
  enable_checkpointing: False
  logger: False
  log_every_n_steps: 200
  check_val_every_n_epoch: 1

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: True
  create_checkpoint_callback: True
  checkpoint_callback_params:
    save_top_k: 1
    monitor: "val_per"
    mode: "min"
    save_best_model: true
